<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisation 3D - Villa Moderne</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 300px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p {
            margin: 0 0 20px 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #3498db;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #2980b9;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            transition: opacity 0.5s;
        }
    </style>
    <!-- Import de Three.js et OrbitControls via CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="loading">Génération de la structure 3D...</div>
    <div id="canvas-container"></div>

    <div id="ui-container">
        <h1>Villa Contemporaine</h1>
        <p>Visualisation interactive 3D d'un concept architectural.</p>
        
        <div class="control-group">
            <label>Interaction</label>
            <span style="font-size: 0.85rem; color: #999;">
                • Clic gauche + glisser : Rotation<br>
                • Clic droit + glisser : Panoramique<br>
                • Molette : Zoom
            </span>
        </div>

        <div class="control-group" style="margin-top: 20px;">
            <button id="btn-light">Alterner Jour / Nuit</button>
        </div>
    </div>

    <script>
        // --- Configuration Initiale ---
        const container = document.getElementById('canvas-container');
        const loadingEl = document.getElementById('loading');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0a0a0);
        scene.fog = new THREE.FogExp2(0xa0a0a0, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 20, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 100;

        // --- Lumières ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        dirLight.position.set(40, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 150;
        const d = 40;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- Environnement (Sol & Jardin) ---
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x557a46, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Allée en béton
        const drivewayGeo = new THREE.PlaneGeometry(12, 40);
        const drivewayMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.8 });
        const driveway = new THREE.Mesh(drivewayGeo, drivewayMat);
        driveway.rotation.x = -Math.PI / 2;
        driveway.position.set(0, 0.01, 20);
        driveway.receiveShadow = true;
        scene.add(driveway);

        // --- Construction de la Villa Prototypale ---
        const villaGroup = new THREE.Group();

        // Matériaux
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xfcfcfc, roughness: 0.6 });
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x8e6f57, roughness: 0.4 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.3, roughness: 0.1, metalness: 0.9 });
        const frameMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.5 });
        const poolMat = new THREE.MeshStandardMaterial({ color: 0x41c9e2, roughness: 0.2, metalness: 0.1 });

        // Rez-de-chaussée
        const rdcGeo = new THREE.BoxGeometry(16, 5, 12);
        const rdc = new THREE.Mesh(rdcGeo, wallMat);
        rdc.position.y = 2.5;
        rdc.castShadow = true;
        rdc.receiveShadow = true;
        villaGroup.add(rdc);

        // Étage
        const etageGeo = new THREE.BoxGeometry(12, 4.5, 14);
        const etage = new THREE.Mesh(etageGeo, wallMat);
        etage.position.set(-2, 7.25, 1);
        etage.castShadow = true;
        etage.receiveShadow = true;
        villaGroup.add(etage);

        // Mur d'accent en bois
        const woodPanelGeo = new THREE.BoxGeometry(6, 4.5, 0.2);
        const woodPanel = new THREE.Mesh(woodPanelGeo, woodMat);
        woodPanel.position.set(1, 7.25, 8.01);
        woodPanel.castShadow = true;
        villaGroup.add(woodPanel);

        // Baies vitrées
        const glassGeo = new THREE.BoxGeometry(8, 4, 0.1);
        const glass = new THREE.Mesh(glassGeo, glassMat);
        glass.position.set(3, 2, 6.01);
        villaGroup.add(glass);

        // Cadres
        const frameGeo = new THREE.BoxGeometry(8.2, 4.2, 0.2);
        const frame = new THREE.Mesh(frameGeo, frameMat);
        frame.position.set(3, 2, 5.95);
        villaGroup.add(frame);

        // --- Piscine ---
        const poolStructureGeo = new THREE.BoxGeometry(10, 1, 6);
        const poolStructure = new THREE.Mesh(poolStructureGeo, frameMat);
        poolStructure.position.set(12, 0.02, 5);
        scene.add(poolStructure);

        const poolWaterGeo = new THREE.PlaneGeometry(9.6, 5.6);
        const poolWater = new THREE.Mesh(poolWaterGeo, poolMat);
        poolWater.rotation.x = -Math.PI / 2;
        poolWater.position.set(12, 0.53, 5);
        scene.add(poolWater);

        scene.add(villaGroup);

        // Retirer l'écran de chargement
        loadingEl.style.opacity = 0;
        setTimeout(() => loadingEl.remove(), 500);

        // --- Gestion du Cycle Jour / Nuit ---
        let isNight = false;
        document.getElementById('btn-light').addEventListener('click', () => {
            isNight = !isNight;
            if (isNight) {
                scene.background.setHex(0x0a0e14);
                scene.fog.color.setHex(0x0a0e14);
                dirLight.intensity = 0.1;
                dirLight.color.setHex(0x7799bb);
                ambientLight.intensity = 0.15;
                ambientLight.color.setHex(0x445577);
            } else {
                scene.background.setHex(0xa0a0a0);
                scene.fog.color.setHex(0xa0a0a0);
                dirLight.intensity = 0.8;
                dirLight.color.setHex(0xfffaed);
                ambientLight.intensity = 0.4;
                ambientLight.color.setHex(0xffffff);
            }
        });

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
