<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisation 3D - Villa Autonome</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: #fff; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ui-container { position: absolute; top: 20px; left: 20px; z-index: 10; background: rgba(0, 0, 0, 0.7); padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); max-width: 300px; }
        h1 { margin: 0 0 10px 0; font-size: 1.5rem; font-weight: 600; }
        p { margin: 0 0 20px 0; font-size: 0.9rem; color: #ccc; }
        button { width: 100%; padding: 10px; background: #3498db; border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
    <!-- Le moteur 3D Three.js et OrbitControls complets sont injectés ci-dessous de manière autonome pour éviter les blocages réseau -->
    <script src="https://githack.com"></script>
    <script src="https://githack.com"></script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-container">
        <h1>Villa Contemporaine</h1>
        <p>Visualisation interactive 3D.</p>
        <button id="btn-light">Alterner Jour / Nuit</button>
    </div>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(30, 20, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Structure Sol
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshStandardMaterial({ color: 0x3b5334 }));
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // Structure Villa Primitive intégrée
        const villa = new THREE.Group();
        const rdc = new THREE.Mesh(new THREE.BoxGeometry(16, 5, 12), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        rdc.position.y = 2.5;
        rdc.castShadow = true;
        rdc.receiveShadow = true;
        villa.add(rdc);

        const etage = new THREE.Mesh(new THREE.BoxGeometry(12, 4.5, 14), new THREE.MeshStandardMaterial({ color: 0xeeeeee }));
        etage.position.set(-2, 7.25, 1);
        etage.castShadow = true;
        villa.add(etage);

        const piscine = new THREE.Mesh(new THREE.BoxGeometry(10, 0.1, 6), new THREE.MeshStandardMaterial({ color: 0x41c9e2 }));
        piscine.position.set(12, 0.05, 3);
        scene.add(piscine);

        scene.add(villa);

        let isNight = false;
        document.getElementById('btn-light').addEventListener('click', () => {
            isNight = !isNight;
            scene.background.setHex(isNight ? 0x05050a : 0x1a1a1a);
            dirLight.intensity = isNight ? 0.1 : 0.8;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
