<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisation 3D - Import Modèle Villa</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 300px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        p {
            margin: 0 0 20px 0;
            font-size: 0.9rem;
            color: #ccc;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #aaa;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2ecc71;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        button:hover {
            background: #27ae60;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            font-size: 1.5rem;
            font-weight: bold;
            background: rgba(0,0,0,0.8);
            padding: 20px 40px;
            border-radius: 8px;
            border: 1px solid #444;
            pointer-events: none;
            transition: opacity 0.5s;
            text-align: center;
        }
    </style>
    <!-- Import de Three.js, OrbitControls et GLTFLoader via CDN -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="loading">Chargement du modèle 3D... <br><span id="progress" style="font-size:1rem; color:#aaa;">0%</span></div>
    <div id="canvas-container"></div>

    <div id="ui-container">
        <h1>Villa 3D Personnalisée</h1>
        <p>Visualisation interactive avec support d'importation GLTF/GLB.</p>
        
        <div class="control-group">
            <label>Interaction</label>
            <span style="font-size: 0.85rem; color: #999;">
                • Clic gauche : Rotation<br>
                • Clic droit : Panoramique<br>
                • Molette : Zoom
            </span>
        </div>

        <div class="control-group" style="margin-top: 20px;">
            <button id="btn-light">Alterner Jour / Nuit</button>
        </div>
    </div>

    <script>
        // --- CONFIGURATION DU FICHIER 3D ---
        // Ajoutez l'adresse complète (URL ou chemin local) de votre fichier .glb ou .gltf ici :
        const MODEL_URL = 'https://githubusercontent.com'; 

        // --- Configuration Initiale Scene ---
        const container = document.getElementById('canvas-container');
        const loadingEl = document.getElementById('loading');
        const progressEl = document.getElementById('progress');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xa0a0a0);
        scene.fog = new THREE.FogExp2(0xa0a0a0, 0.01);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(25, 15, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding; 
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 150;

        // --- Lumières ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
        dirLight.position.set(30, 40, 20);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 200;
        const d = 50;
        dirLight.shadow.camera.left = -d;
        dirLight.shadow.camera.right = d;
        dirLight.shadow.camera.top = d;
        dirLight.shadow.camera.bottom = -d;
        scene.add(dirLight);

        // --- Environnement (Sol de base) ---
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        // --- Chargeur de Modèle GLTF ---
        const loader = new THREE.GLTFLoader();

        loader.load(
            MODEL_URL,
            function (gltf) {
                const model = gltf.scene;
                
                model.traverse(function (node) {
                    if (node.isMesh) {
                        node.castShadow = true;
                        node.receiveShadow = true;
                        if(node.material) node.material.depthWrite = true;
                    }
                });

                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                model.position.x += (model.position.x - center.x);
                model.position.z += (model.position.z - center.z);
                model.position.y += (model.position.y - box.min.y); 

                scene.add(model);

                loadingEl.style.opacity = 0;
                setTimeout(() => loadingEl.remove(), 500);
            },
            function (xhr) {
                if (xhr.total > 0) {
                    const percentComplete = (xhr.loaded / xhr.total) * 100;
                    progressEl.textContent = Math.round(percentComplete) + '%';
                } else {
                    progressEl.textContent = (xhr.loaded / 1024 / 1024).toFixed(2) + ' MB chargés';
                }
            },
            function (error) {
                console.error('Erreur lors du chargement du modèle:', error);
                progressEl.innerHTML = '<span style="color:#ff4a4a;">Erreur de chargement.</span>';
            }
        );

        // --- Cycle Jour / Nuit ---
        let isNight = false;
        document.getElementById('btn-light').addEventListener('click', () => {
            isNight = !isNight;
            if (isNight) {
                scene.background.setHex(0x05070a);
                scene.fog.color.setHex(0x05070a);
                dirLight.intensity = 0.05;
                dirLight.color.setHex(0x5577aa);
                ambientLight.intensity = 0.15;
                ambientLight.color.setHex(0x334466);
            } else {
                scene.background.setHex(0xa0a0a0);
                scene.fog.color.setHex(0xa0a0a0);
                dirLight.intensity = 0.8;
                dirLight.color.setHex(0xfffaed);
                ambientLight.intensity = 0.6;
                ambientLight.color.setHex(0xffffff);
            }
        });

        // --- Redimensionnement de la fenêtre ---
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Boucle d'animation ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
